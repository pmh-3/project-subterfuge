name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint, typecheck, contrast, and test
        run: npm run verify

      - name: Build web bundle
        run: npx expo export --platform web

      - name: Cache Expo web output
        uses: actions/cache@v4
        with:
          path: client/dist
          key: expo-web-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            expo-web-${{ runner.os }}-
