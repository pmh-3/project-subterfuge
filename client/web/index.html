<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    
    <!-- Google Fonts - loaded from CDN for web -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Playfair+Display:wght@700&family=Special+Elite&display=swap" rel="stylesheet" />
    
    <title>Midnight Wire</title>
    
    <style>
      /* Map Google Font names to what Expo expects */
      @font-face {
        font-family: 'PlayfairDisplay_700Bold';
        src: local('Playfair Display Bold'), local('PlayfairDisplay-Bold');
        font-weight: 700;
      }
      @font-face {
        font-family: 'SpecialElite_400Regular';
        src: local('Special Elite'), local('SpecialElite-Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Inter_600SemiBold';
        src: local('Inter SemiBold'), local('Inter-SemiBold');
        font-weight: 600;
      }
      
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1A1614;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
